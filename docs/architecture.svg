<svg viewBox="0 0 1240 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Theme-proof card background so text is readable on both light & dark GitHub themes -->
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="440" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="60" y="66" font-size="30" font-weight="700" fill="#0f172a">MoneyTrace</text>
  <text x="60" y="96" font-size="16" font-weight="500" fill="#64748b">Follow every payment. Explain every discrepancy.</text>
  <g transform="translate(1000,52)">
    <rect x="0" y="0" width="180" height="34" rx="17" fill="#dcfce7"/>
    <circle cx="24" cy="17" r="5" fill="#16a34a"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="40" y="22" font-size="13" font-weight="700" fill="#15803d" letter-spacing="0.5">LIVE · SYNCED</text>
  </g>

  <!-- Pipeline track -->
  <line x1="140" y1="240" x2="1100" y2="240" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <line x1="140" y1="240" x2="1100" y2="240" stroke="url(#track)" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 12">
    <animate attributeName="stroke-dashoffset" values="0;-52" dur="1.1s" repeatCount="indefinite"/>
  </line>

  <!-- Flowing coins moving along the pipeline -->
  <g fill="#f59e0b">
    <circle r="9">
      <animateMotion path="M140,240 L1100,240" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" opacity="0.85">
      <animateMotion path="M140,240 L1100,240" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" opacity="0.7">
      <animateMotion path="M140,240 L1100,240" dur="3.4s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Stage node helper via explicit groups -->
  <!-- 1. Payment -->
  <g transform="translate(140,240)">
    <circle r="34" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5" filter="url(#soft)"/>
    <text x="0" y="6" font-size="22" text-anchor="middle">💳</text>
    <text x="0" y="70" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Payment</text>
    <text x="0" y="92" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">₹8,499</text>
    <text x="0" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">pay_Sk4D1e8T…</text>
  </g>

  <!-- 2. Captured -->
  <g transform="translate(380,240)">
    <circle r="34" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5" filter="url(#soft)"/>
    <text x="0" y="6" font-size="22" text-anchor="middle">✅</text>
    <text x="0" y="70" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Captured</text>
    <text x="0" y="92" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">₹8,499</text>
    <text x="0" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">UPI · success@razorpay</text>
  </g>

  <!-- 3. Settlement -->
  <g transform="translate(620,240)">
    <circle r="34" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5" filter="url(#soft)"/>
    <text x="0" y="6" font-size="22" text-anchor="middle">🏦</text>
    <text x="0" y="70" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Settlement</text>
    <text x="0" y="92" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">₹8,298</text>
    <g transform="translate(0,104)">
      <rect x="-34" y="0" width="68" height="19" rx="9" fill="#fef3c7"/>
      <text x="0" y="13" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">− fee ₹201</text>
    </g>
  </g>

  <!-- 4. Bank credit -->
  <g transform="translate(860,240)">
    <circle r="34" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5" filter="url(#soft)"/>
    <text x="0" y="6" font-size="22" text-anchor="middle">💰</text>
    <text x="0" y="70" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Bank credit</text>
    <text x="0" y="92" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">₹8,298</text>
    <text x="0" y="112" font-size="11" fill="#94a3b8" text-anchor="middle">HDFC · HDFC-38695</text>
  </g>

  <!-- 5. Reconciled -->
  <g transform="translate(1100,240)">
    <circle r="38" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#soft)">
      <animate attributeName="r" values="38;41;38" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M-14,2 L-4,13 L15,-10" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="74" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">Reconciled</text>
    <text x="0" y="96" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">97% confidence</text>
    <text x="0" y="116" font-size="11" fill="#94a3b8" text-anchor="middle">auto-resolved</text>
  </g>

  <!-- Bottom caption -->
  <text x="620" y="410" font-size="14" fill="#64748b" text-anchor="middle" font-style="italic">Every difference is detected, explained, scored, and written to an immutable audit trail.</text>
</svg>
